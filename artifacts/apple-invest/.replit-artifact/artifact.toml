kind = "web"
previewPath = "/"
title = "Apple Invest"
description = "The imported Apple Invest web app, preserving its Portuguese equipment catalog, account, wallet, team, administration, and support chat screens."
version = "1.0.0"
id = "artifacts/apple-invest"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25765

[services.development]
run = "pnpm --filter @workspace/apple-invest run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/apple-invest", "run", "build" ]
serve = "static"
publicDir = "artifacts/apple-invest/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25765"
BASE_PATH = "/"
